services:
  pollwalker:
    build: .
    container_name: pollwalker
    restart: unless-stopped
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DB_PATH: /app/data/polls.db
      ENFORCE_IP_DEDUP: ${ENFORCE_IP_DEDUP:-true}
      IP_HASH_SECRET: ${IP_HASH_SECRET:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
    volumes:
      - poll_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: pollwalker-nginx
    restart: unless-stopped
    networks:
      - default
      - proxy
    depends_on:
      pollwalker:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  poll_data:

networks:
  proxy:
    external: true
