services:
  poll-walker:
    build: .
    container_name: poll-walker
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DB_PATH: /app/data/polls.db
      ENFORCE_IP_DEDUP: ${ENFORCE_IP_DEDUP:-true}
    volumes:
      - poll_data:/app/data

  nginx:
    image: nginx:alpine
    container_name: poll-walker-nginx
    restart: unless-stopped
    depends_on:
      poll-walker:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  poll_data:
