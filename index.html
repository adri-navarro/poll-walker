<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poll Walker — Create & Share Live Polls</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = theme;
          var savedLang = localStorage.getItem('lang');
          var lang = savedLang === 'en' || savedLang === 'es' ? savedLang : null;
          if (!lang) {
            var langs = Array.isArray(navigator.languages) && navigator.languages.length
              ? navigator.languages
              : [navigator.language || 'en'];
            for (var i = 0; i < langs.length; i++) {
              var base = String(langs[i] || '').toLowerCase().split('-')[0];
              if (base === 'es' || base === 'en') {
                lang = base;
                break;
              }
            }
          }
          document.documentElement.lang = lang || 'en';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
